<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lector QR · Reyes Magos</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 16px;
      text-align: center;
      color: #1e293b;
      background-color: #f8fafc;
    }
    h2 { margin-bottom: 6px; color: #0f172a; font-size: 1.25rem; }
    p { color: #64748b; font-size: 0.875rem; margin-top: 0; }
    #lector { 
      width: 100%; 
      max-width: 320px; 
      margin: 16px auto; 
      border-radius: 16px; 
      overflow: hidden; 
      border: 2px solid #cbd5e1;
      background: #000;
    }
    #estado { 
      padding: 12px 16px; 
      background: #e2e8f0; 
      border-radius: 12px; 
      font-size: 0.875rem;
      font-weight: 500;
      color: #334155;
    }
    button {
      padding: 12px 20px;
      margin-top: 12px;
      font-size: 0.875rem;
      font-weight: 600;
      border: 0;
      border-radius: 10px;
      background: #d97706;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>Escáner QR de Almacén</h2>
  <p>Apunta la cámara al código QR de la carta o paquete.</p>
  <div id="estado">Iniciando cámara…</div>
  <div id="lector"></div>
  <button id="reintentar" hidden>Volver a escanear</button>

  <script>
    const estado = document.getElementById("estado");
    const boton = document.getElementById("reintentar");
    let scanner = null;
    let ocupado = false;

    async function iniciar() {
      ocupado = false;
      boton.hidden = true;
      estado.textContent = "Solicitando acceso a la cámara…";

      try {
        if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
          throw new Error("Abre esta página mediante su dirección HTTPS de GitHub Pages.");
        }
        if (!scanner) {
          scanner = new Html5Qrcode("lector");
        }
        await scanner.start(
          { facingMode: "environment" },
          {
            fps: 12,
            qrbox: { width: 250, height: 250 },
            aspectRatio: 1
          },
          async (texto) => {
            if (ocupado) return;
            ocupado = true;
            estado.textContent = "¡QR leído con éxito! Enviando a la aplicación…";
            try {
              await scanner.stop();
            } catch (_) {}

            if (window.opener && !window.opener.closed) {
              // Envía el resultado a la ventana principal sin restricciones de origen
              window.opener.postMessage(
                { type: "QR_BRIDGE_RESULT", text: texto, codigo: texto },
                "*"
              );
              estado.textContent = "Resultado enviado. Volviendo al almacén…";
              setTimeout(() => {
                window.close();
              }, 400);
            } else {
              estado.textContent = "QR leído: " + texto + ". No se encontró la ventana principal abierta.";
              boton.hidden = false;
            }
          },
          () => {}
        );
        estado.textContent = "Cámara activa. Enfoca el código QR.";
      } catch (error) {
        estado.textContent = "Error al iniciar cámara: " + (error.message || error);
        boton.hidden = false;
      }
    }

    boton.addEventListener("click", iniciar);
    iniciar();
  </script>
</body>
</html>
